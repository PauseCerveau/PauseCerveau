name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ranger les fichiers dans les bons dossiers
        run: |
          shopt -s nullglob
          mkdir -p app/src/main/java/fr/pausecerveau
          for f in ./*.kt; do mv "$f" app/src/main/java/fr/pausecerveau/; done
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; fi
          rm -f ./*.kts app/*.kts

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PauseCerveau"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "fr.pausecerveau"
              compileSdk = 34
              defaultConfig {
                  applicationId = "fr.pausecerveau"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "Fichiers rangÃ©s :"
          find app -type f

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Construire l'application
        run: gradle assembleDebug

      - name: Publier l'APK Ã  tÃ©lÃ©charger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PauseCerveau.apk
          gh release create "v${{ github.run_number }}" PauseCerveau.apk \
            --title "Pause Cerveau v${{ github.run_number }}" \
            --notes "Ouvrez ce lien depuis le tÃ©lÃ©phone et touchez PauseCerveau.apk pour l'installer."
